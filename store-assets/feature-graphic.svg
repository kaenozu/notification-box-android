<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" role="img" aria-labelledby="title desc">
  <title id="title">通知箱 Google Play Feature Graphic</title>
  <desc id="desc">通知を、消さずに整理する。端末内で分類。まずは安全に試算。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#063B59"/>
      <stop offset="1" stop-color="#1B5E8C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#001E30" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1024" height="500" rx="0" fill="url(#bg)"/>
  <circle cx="880" cy="84" r="180" fill="#8DCDFF" opacity="0.12"/>
  <circle cx="770" cy="480" r="240" fill="#CBE6FF" opacity="0.08"/>

  <g transform="translate(72 94)" filter="url(#shadow)">
    <rect width="260" height="312" rx="44" fill="#F8F9FC"/>
    <rect x="42" y="58" width="176" height="24" rx="12" fill="#1B5E8C"/>
    <rect x="42" y="112" width="130" height="20" rx="10" fill="#4E616E" opacity="0.8"/>
    <rect x="42" y="160" width="152" height="20" rx="10" fill="#4E616E" opacity="0.55"/>
    <path d="M164 192l48 48-20 20-28-28-52 52-20-20z" fill="#1B5E8C"/>
  </g>

  <g transform="translate(390 116)" fill="#FFFFFF">
    <text x="0" y="60" font-family="system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="58" font-weight="800" letter-spacing="2">通知箱</text>
    <text x="0" y="132" font-family="system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="36" font-weight="700">通知を、消さずに整理する。</text>
    <text x="0" y="196" font-family="system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="25" opacity="0.88">端末内で分類。まずは安全に試算。</text>
  </g>

  <g transform="translate(390 350)" font-family="system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="19" font-weight="700">
    <rect width="114" height="48" rx="24" fill="#CBE6FF"/>
    <text x="57" y="31" text-anchor="middle" fill="#001E30">優先</text>
    <rect x="128" width="164" height="48" rx="24" fill="#D1E5F4"/>
    <text x="210" y="31" text-anchor="middle" fill="#0A1E29">あとで確認</text>
    <rect x="306" width="126" height="48" rx="24" fill="#FFFFFF" opacity="0.9"/>
    <text x="369" y="31" text-anchor="middle" fill="#20333E">低優先</text>
  </g>
</svg>
