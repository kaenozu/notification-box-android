name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Verify immutable action references
        run: python3 .github/scripts/verify-action-pins.py

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify repository outputs
        run: |
          git diff --check
          git diff --exit-code -- app/schemas
          test -z "$(git ls-files --others --exclude-standard app/schemas)"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Upload Linux diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-ci-diagnostics
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            app/build/reports/lint-results-debug.html
            app/build/outputs/apk/debug/app-debug.apk
            app/schemas
          if-no-files-found: warn
          retention-days: 14

  verify-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Resolve Robolectric 4.16.1
        shell: pwsh
        run: |
          $output = & .\gradlew.bat :app:dependencyInsight `
            --dependency org.robolectric:robolectric `
            --configuration debugUnitTestRuntimeClasspath `
            --no-daemon 2>&1
          $output | Tee-Object -FilePath "$env:RUNNER_TEMP\dependency-insight-windows.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($output | Select-String 'org\.robolectric:robolectric:4\.16\.1' -Quiet)) {
            throw "Robolectric 4.16.1 was not resolved."
          }

      - name: Clean project outputs
        shell: pwsh
        run: |
          .\gradlew.bat --stop
          Remove-Item -Recurse -Force .\.gradle -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force .\build -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force .\app\build -ErrorAction SilentlyContinue

      - name: Windows validation
        shell: pwsh
        run: |
          .\gradlew.bat testDebugUnitTest lintDebug assembleDebug `
            --no-build-cache `
            --rerun-tasks `
            --stacktrace `
            --no-daemon

          $testCount = 0
          Get-ChildItem .\app\build\test-results\testDebugUnitTest\TEST-*.xml |
            ForEach-Object {
              [xml]$result = Get-Content -Raw $_.FullName
              $testCount += [int]$result.testsuite.tests
            }
          if ($testCount -lt 47) {
            throw "Expected at least 47 Windows unit tests; found $testCount."
          }

          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- app/schemas
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (git ls-files --others --exclude-standard app/schemas) {
            throw "Untracked Room schemas detected."
          }
          if (git status --porcelain --untracked-files=all) {
            throw "Validation modified the working tree."
          }

      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-ci-diagnostics
          path: |
            ${{ runner.temp }}/dependency-insight-windows.log
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            app/build/reports/lint-results-debug.html
            app/build/outputs/apk/debug/app-debug.apk
            app/schemas
          if-no-files-found: warn
          retention-days: 14
