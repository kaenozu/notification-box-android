name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Unit tests
        id: unit_tests
        run: |
          set +e
          ./gradlew testDebugUnitTest --no-daemon > unit-tests.log 2>&1
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ]; then cat unit-tests.log; fi
          exit 0

      - name: Lint
        id: lint
        run: |
          set +e
          ./gradlew lintDebug --no-daemon > lint.log 2>&1
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ]; then cat lint.log; fi
          exit 0

      - name: Assemble debug
        id: assemble
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon > assemble.log 2>&1
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ]; then cat assemble.log; fi
          exit 0

      - name: Verify Room schema is committed
        id: schema
        run: |
          set +e
          : > schema-diff.log
          git diff --exit-code -- app/schemas >> schema-diff.log 2>&1
          tracked_exit=$?
          schema_status="$(git status --porcelain --untracked-files=all -- app/schemas)"
          if [ -n "$schema_status" ]; then
            echo "$schema_status" >> schema-diff.log
          fi
          if [ "$tracked_exit" -ne 0 ] || [ -n "$schema_status" ]; then
            exit_code=1
            cat schema-diff.log
          else
            exit_code=0
          fi
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-diagnostics
          path: |
            unit-tests.log
            lint.log
            assemble.log
            schema-diff.log
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn

      - name: Upload Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema
          path: app/schemas
          if-no-files-found: error

      - name: Verify outcomes
        if: always()
        env:
          UNIT_EXIT: ${{ steps.unit_tests.outputs.exit_code }}
          LINT_EXIT: ${{ steps.lint.outputs.exit_code }}
          ASSEMBLE_EXIT: ${{ steps.assemble.outputs.exit_code }}
          SCHEMA_EXIT: ${{ steps.schema.outputs.exit_code }}
        run: |
          failed=0
          for result in "$UNIT_EXIT" "$LINT_EXIT" "$ASSEMBLE_EXIT" "$SCHEMA_EXIT"; do
            if [ "$result" != "0" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Unit tests exit: $UNIT_EXIT"
            echo "Lint exit: $LINT_EXIT"
            echo "Assemble exit: $ASSEMBLE_EXIT"
            echo "Schema exit: $SCHEMA_EXIT"
            exit 1
          fi
