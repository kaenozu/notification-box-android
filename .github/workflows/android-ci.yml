name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Make Gradle executable
        run: |
          git config core.fileMode false
          chmod +x gradlew

      - name: Verify immutable action references
        run: |
          set -o pipefail
          python3 .github/scripts/verify-action-pins.py 2>&1 \
            | tee "$RUNNER_TEMP/action-pins.log"

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon 2>&1 \
            | tee "$RUNNER_TEMP/unit-tests.log"

      - name: Lint
        run: |
          set -o pipefail
          ./gradlew lintDebug --no-daemon 2>&1 \
            | tee "$RUNNER_TEMP/lint.log"

      - name: Assemble debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 \
            | tee "$RUNNER_TEMP/assemble.log"

      - name: Verify repository outputs
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/repository.log"
          : > "$log"
          failed=0
          git diff --check >> "$log" 2>&1 || failed=1
          git diff --exit-code -- app/schemas >> "$log" 2>&1 || failed=1
          untracked="$(git ls-files --others --exclude-standard app/schemas)"
          if [ -n "$untracked" ]; then
            printf '%s\n' "$untracked" >> "$log"
            failed=1
          fi
          working_tree="$(git status --porcelain --untracked-files=all)"
          if [ -n "$working_tree" ]; then
            printf '%s\n' "$working_tree" >> "$log"
            failed=1
          fi
          cat "$log"
          exit "$failed"

      - name: Upload Linux diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-ci-diagnostics
          path: |
            ${{ runner.temp }}/action-pins.log
            ${{ runner.temp }}/unit-tests.log
            ${{ runner.temp }}/lint.log
            ${{ runner.temp }}/assemble.log
            ${{ runner.temp }}/repository.log
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            app/build/reports/lint-results-debug.html
            app/build/outputs/apk/debug/app-debug.apk
            app/schemas
          if-no-files-found: warn
          retention-days: 14

  verify-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Resolve Robolectric 4.16.1
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "dependency-insight-windows.log"
          $output = & .\gradlew.bat :app:dependencyInsight `
            --dependency org.robolectric:robolectric `
            --configuration debugUnitTestRuntimeClasspath `
            --no-daemon 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $log
          if ($exitCode -ne 0) { exit $exitCode }
          if (-not ($output | Select-String 'org\.robolectric:robolectric:4\.16\.1' -Quiet)) {
            throw "Robolectric 4.16.1 was not resolved."
          }

      - name: Clean project outputs
        shell: pwsh
        run: |
          .\gradlew.bat --stop
          Remove-Item -Recurse -Force .\.gradle -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force .\build -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force .\app\build -ErrorAction SilentlyContinue

      - name: Unit tests
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "unit-tests-windows.log"
          $output = & .\gradlew.bat testDebugUnitTest `
            --no-build-cache `
            --rerun-tasks `
            --stacktrace `
            --no-daemon 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $log
          if ($exitCode -ne 0) { exit $exitCode }

          $testCount = 0
          Get-ChildItem .\app\build\test-results\testDebugUnitTest\TEST-*.xml -ErrorAction SilentlyContinue |
            ForEach-Object {
              [xml]$result = Get-Content -Raw $_.FullName
              $testCount += [int]$result.testsuite.tests
            }
          Write-Host "Windows unit test count: $testCount"
          if ($testCount -lt 47) {
            throw "Expected at least 47 Windows unit tests, found $testCount."
          }

      - name: Lint
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "lint-windows.log"
          $output = & .\gradlew.bat lintDebug --no-build-cache --no-daemon 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $log
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Assemble debug
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "assemble-windows.log"
          $output = & .\gradlew.bat assembleDebug --no-build-cache --no-daemon 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $log
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Verify repository outputs
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "repository-windows.log"
          $failed = $false

          git diff --check 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { $failed = $true }

          git diff --exit-code -- app/schemas 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { $failed = $true }

          $untrackedSchemas = git ls-files --others --exclude-standard app/schemas
          if ($untrackedSchemas) {
            $untrackedSchemas | Tee-Object -FilePath $log -Append
            $failed = $true
          }

          $workingTree = git status --porcelain --untracked-files=all
          if ($workingTree) {
            $workingTree | Tee-Object -FilePath $log -Append
            $failed = $true
          }

          if ($failed) {
            Get-Content $log
            throw "Repository verification failed."
          }

      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-ci-diagnostics
          path: |
            ${{ runner.temp }}/dependency-insight-windows.log
            ${{ runner.temp }}/unit-tests-windows.log
            ${{ runner.temp }}/lint-windows.log
            ${{ runner.temp }}/assemble-windows.log
            ${{ runner.temp }}/repository-windows.log
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            app/build/reports/lint-results-debug.html
            app/build/outputs/apk/debug/app-debug.apk
            app/schemas
          if-no-files-found: warn
          retention-days: 14
