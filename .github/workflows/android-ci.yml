name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Unit tests
        id: unit_tests
        run: |
          set +e
          ./gradlew testDebugUnitTest --no-daemon > unit-tests.log 2>&1
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ]; then cat unit-tests.log; fi
          exit 0

      - name: Lint
        id: lint
        run: |
          set +e
          ./gradlew lintDebug --no-daemon > lint.log 2>&1
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ]; then cat lint.log; fi
          exit 0

      - name: Assemble debug
        id: assemble
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon > assemble.log 2>&1
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ]; then cat assemble.log; fi
          exit 0

      - name: Verify Room schema is committed
        id: schema
        run: |
          set +e
          : > schema-diff.log
          git diff --exit-code -- app/schemas >> schema-diff.log 2>&1
          tracked_exit=$?
          schema_status="$(git status --porcelain --untracked-files=all -- app/schemas)"
          if [ -n "$schema_status" ]; then
            echo "$schema_status" >> schema-diff.log
          fi
          if [ "$tracked_exit" -ne 0 ] || [ -n "$schema_status" ]; then
            exit_code=1
            cat schema-diff.log
          else
            exit_code=0
          fi
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-diagnostics
          path: |
            unit-tests.log
            lint.log
            assemble.log
            schema-diff.log
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn

      - name: Upload Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema
          path: app/schemas
          if-no-files-found: error

      - name: Verify outcomes
        if: always()
        env:
          UNIT_EXIT: ${{ steps.unit_tests.outputs.exit_code }}
          LINT_EXIT: ${{ steps.lint.outputs.exit_code }}
          ASSEMBLE_EXIT: ${{ steps.assemble.outputs.exit_code }}
          SCHEMA_EXIT: ${{ steps.schema.outputs.exit_code }}
        run: |
          failed=0
          for result in "$UNIT_EXIT" "$LINT_EXIT" "$ASSEMBLE_EXIT" "$SCHEMA_EXIT"; do
            if [ "$result" != "0" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Unit tests exit: $UNIT_EXIT"
            echo "Lint exit: $LINT_EXIT"
            echo "Assemble exit: $ASSEMBLE_EXIT"
            echo "Schema exit: $SCHEMA_EXIT"
            exit 1
          fi

  verify-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve Robolectric 4.16.1
        id: robolectric
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "dependency-insight-windows.log"
          & .\gradlew.bat dependencyInsight `
            --dependency org.robolectric:robolectric `
            --configuration testDebugUnitTestRuntimeClasspath `
            --no-daemon 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          $resolved = Select-String -Path $log -Pattern 'org\.robolectric:robolectric:4\.16\.1' -Quiet
          if (-not $resolved) {
            Write-Error "Robolectric 4.16.1 was not resolved."
            $exitCode = 1
          }
          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Clean project outputs
        shell: pwsh
        run: |
          .\gradlew.bat --stop
          Remove-Item -Recurse -Force .\.gradle -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force .\build -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force .\app\build -ErrorAction SilentlyContinue

      - name: Unit tests
        id: unit_tests_windows
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "unit-tests-windows.log"
          & .\gradlew.bat testDebugUnitTest `
            --no-build-cache `
            --rerun-tasks `
            --stacktrace `
            --no-daemon 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          $legacyBackend = Select-String -Path $log -Pattern 'ShadowLegacySQLiteConnection' -Quiet
          if ($legacyBackend) {
            Write-Error "ShadowLegacySQLiteConnection was detected."
            $exitCode = 1
          }
          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Lint
        id: lint_windows
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "lint-windows.log"
          & .\gradlew.bat lintDebug --no-build-cache --no-daemon 2>&1 |
            Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Assemble debug
        id: assemble_windows
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "assemble-windows.log"
          & .\gradlew.bat assembleDebug --no-build-cache --no-daemon 2>&1 |
            Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Verify repository outputs
        id: repository_windows
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "repository-windows.log"
          $failed = $false

          git diff --check 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $failed = $true
          }

          git diff --exit-code -- app/schemas 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) {
            $failed = $true
          }

          $untrackedSchemas = git ls-files --others --exclude-standard app/schemas
          if ($untrackedSchemas) {
            $untrackedSchemas | Tee-Object -FilePath $log -Append
            $failed = $true
          }

          $workingTree = git status --porcelain --untracked-files=all
          if ($workingTree) {
            $workingTree | Tee-Object -FilePath $log -Append
            $failed = $true
          }

          $exitCode = if ($failed) { 1 } else { 0 }
          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ci-diagnostics
          path: |
            ${{ runner.temp }}/dependency-insight-windows.log
            ${{ runner.temp }}/unit-tests-windows.log
            ${{ runner.temp }}/lint-windows.log
            ${{ runner.temp }}/assemble-windows.log
            ${{ runner.temp }}/repository-windows.log
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn

      - name: Upload Windows Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-room-schema
          path: app/schemas
          if-no-files-found: error

      - name: Verify Windows outcomes
        if: always()
        shell: pwsh
        env:
          ROBOLECTRIC_EXIT: ${{ steps.robolectric.outputs.exit_code }}
          UNIT_EXIT: ${{ steps.unit_tests_windows.outputs.exit_code }}
          LINT_EXIT: ${{ steps.lint_windows.outputs.exit_code }}
          ASSEMBLE_EXIT: ${{ steps.assemble_windows.outputs.exit_code }}
          REPOSITORY_EXIT: ${{ steps.repository_windows.outputs.exit_code }}
        run: |
          $results = @(
            $env:ROBOLECTRIC_EXIT,
            $env:UNIT_EXIT,
            $env:LINT_EXIT,
            $env:ASSEMBLE_EXIT,
            $env:REPOSITORY_EXIT
          )
          if ($results -contains $null -or $results -contains "" -or $results -contains "1") {
            Write-Host "Robolectric exit: $env:ROBOLECTRIC_EXIT"
            Write-Host "Unit tests exit: $env:UNIT_EXIT"
            Write-Host "Lint exit: $env:LINT_EXIT"
            Write-Host "Assemble exit: $env:ASSEMBLE_EXIT"
            Write-Host "Repository exit: $env:REPOSITORY_EXIT"
            exit 1
          }
