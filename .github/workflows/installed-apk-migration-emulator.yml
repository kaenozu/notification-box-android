name: Installed APK Migration Emulator

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/verify-installed-apk-migration.sh"
      - ".github/workflows/installed-apk-migration-emulator.yml"
      - "app/build.gradle.kts"
      - "app/schemas/**"
      - "app/src/main/java/com/notificationbox/app/data/db/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-installed-apk-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      V1_BASELINE: b32d2e4835997eada837df1ca1d3b15c760002a7
      V1_DIR: ${{ runner.temp }}/notification-box-v1

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable Gradle and KVM access
        run: |
          chmod +x gradlew .github/scripts/verify-installed-apk-migration.sh
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Build v1 and v2 APKs
        run: |
          git worktree add "$V1_DIR" "$V1_BASELINE"
          chmod +x "$V1_DIR/gradlew"
          "$V1_DIR/gradlew" -p "$V1_DIR" assembleDebug --no-daemon
          ./gradlew assembleDebug --no-daemon

      - name: Verify installed APK overwrite migration
        id: installed_migration
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          script: >-
            bash .github/scripts/verify-installed-apk-migration.sh
            "$V1_DIR/app/build/outputs/apk/debug/app-debug.apk"
            "app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload installed migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-apk-migration-diagnostics
          path: installed-apk-migration-report
          if-no-files-found: warn

      - name: Verify migration outcome
        if: always()
        env:
          MIGRATION_OUTCOME: ${{ steps.installed_migration.outcome }}
        run: |
          if [ "$MIGRATION_OUTCOME" != "success" ]; then
            echo "Installed APK migration outcome: $MIGRATION_OUTCOME"
            if [ -f installed-apk-migration-report/result.txt ]; then
              cat installed-apk-migration-report/result.txt
            fi
            exit 1
          fi
