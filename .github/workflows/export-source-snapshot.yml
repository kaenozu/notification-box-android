name: Apply Notification Summary MVP

on:
  push:
    branches:
      - agent/notification-summary-mvp

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Apply implementation patch
        run: |
          base64 --decode .github/notification-summary.patch.gz.b64 \
            | gzip --decompress \
            > "$RUNNER_TEMP/notification-summary.patch"
          git apply --check "$RUNNER_TEMP/notification-summary.patch"
          git apply "$RUNNER_TEMP/notification-summary.patch"

      - name: Compile debug Kotlin
        run: |
          chmod +x gradlew
          ./gradlew compileDebugKotlin --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Verify repository outputs
        run: |
          git diff --check
          git diff --exit-code -- app/schemas
          test -z "$(git ls-files --others --exclude-standard app/schemas)"

      - name: Commit validated implementation
        run: |
          rm .github/notification-summary.patch.gz.b64
          rm .github/workflows/export-source-snapshot.yml
          git config user.name "OpenAI Agent"
          git config user.email "agent@example.invalid"
          git add -A
          git commit -m "feat: add notification summary MVP"
          git push origin HEAD:agent/notification-summary-mvp
