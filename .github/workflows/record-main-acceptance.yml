name: Record Main Acceptance

on:
  workflow_run:
    workflows:
      - Android CI Exact Ref
      - Android Migration Emulator
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  record:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Record exact-main workflow and combined result
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowName = process.env.WORKFLOW_NAME;
            const headSha = process.env.HEAD_SHA;

            async function upsertComment(issueNumber, marker, body) {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: issueNumber, per_page: 100 }
              );
              const existing = comments.find(comment => comment.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body,
                });
              }
            }

            async function updateGeneratedState(issueNumber, stateBlock) {
              const issue = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber,
              });
              const original = issue.data.body || '';
              const startMarker = '<!-- generated-main-state:start -->';
              const endMarker = '<!-- generated-main-state:end -->';
              const start = original.indexOf(startMarker);
              const end = original.indexOf(endMarker);
              let nextBody;
              if (start >= 0 && end >= start) {
                nextBody =
                  original.slice(0, start) +
                  stateBlock +
                  original.slice(end + endMarker.length);
              } else {
                nextBody = `${stateBlock}\n\n${original}`;
              }
              if (nextBody !== original) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: nextBody,
                });
              }
            }

            const individualIssues =
              workflowName === 'Android CI Exact Ref' ? [5, 6] : [6];
            const individualMarker =
              `<!-- main-acceptance:${workflowName}:${headSha} -->`;
            const individualBody = `${individualMarker}
            ## Automated exact-main acceptance record

            - Workflow: \`${workflowName}\`
            - Exact main commit: \`${headSha}\`
            - Run ID: \`${process.env.RUN_ID}\`
            - Conclusion: **${process.env.CONCLUSION}**
            - Event: \`push\`
            - Branch: \`main\`
            - Run: ${process.env.RUN_URL}

            This record is generated from a completed GitHub Actions \`workflow_run\`. It does not satisfy physical-device validation.`;

            for (const issueNumber of individualIssues) {
              await upsertComment(issueNumber, individualMarker, individualBody);
            }

            const requiredWorkflows = [
              'Android CI Exact Ref',
              'Android Migration Emulator',
            ];
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, event: 'push', branch: 'main', per_page: 100 }
            );
            runs.push({
              id: Number(process.env.RUN_ID),
              run_attempt: Number(process.env.RUN_ATTEMPT || 1),
              name: workflowName,
              head_sha: headSha,
              status: 'completed',
              conclusion: process.env.CONCLUSION,
              html_url: process.env.RUN_URL,
            });

            const latestByWorkflow = new Map();
            for (const run of runs) {
              if (run.head_sha !== headSha || !requiredWorkflows.includes(run.name)) {
                continue;
              }
              const current = latestByWorkflow.get(run.name);
              const runAttempt = run.run_attempt || 1;
              const currentAttempt = current?.run_attempt || 1;
              if (
                !current ||
                runAttempt > currentAttempt ||
                (runAttempt === currentAttempt && run.id > current.id)
              ) {
                latestByWorkflow.set(run.name, run);
              }
            }

            const exactRun = latestByWorkflow.get('Android CI Exact Ref');
            const migrationRun = latestByWorkflow.get('Android Migration Emulator');
            const resultOf = run => {
              if (!run) return 'MISSING';
              if (run.status !== 'completed') return run.status.toUpperCase();
              return (run.conclusion || 'UNKNOWN').toUpperCase();
            };
            const exactResult = resultOf(exactRun);
            const migrationResult = resultOf(migrationRun);
            const failingResults = new Set([
              'FAILURE',
              'CANCELLED',
              'TIMED_OUT',
              'ACTION_REQUIRED',
              'STARTUP_FAILURE',
              'STALE',
              'NEUTRAL',
            ]);

            let combinedResult = 'PENDING';
            if (exactResult === 'SUCCESS' && migrationResult === 'SUCCESS') {
              combinedResult = 'PASS';
            } else if (
              failingResults.has(exactResult) ||
              failingResults.has(migrationResult)
            ) {
              combinedResult = 'FAIL';
            }

            const runLine = run =>
              run ? `run \`${run.id}\` — ${run.html_url}` : 'run not found';
            const combinedMarker = `<!-- combined-main-acceptance:${headSha} -->`;
            const combinedBody = `${combinedMarker}
            ## Combined exact-main acceptance gate

            - Exact main commit: \`${headSha}\`
            - Android CI Exact Ref: **${exactResult}** — ${runLine(exactRun)}
            - Android Migration Emulator: **${migrationResult}** — ${runLine(migrationRun)}
            - Combined result: **${combinedResult}**

            \`PASS\` requires both workflows to complete successfully for the same commit SHA. This gate does not satisfy physical-device validation.`;

            const generatedState = `<!-- generated-main-state:start -->
            ## Generated current-main state

            \`\`\`text
            main_head: ${headSha}
            exact_ref_gate: ${exactResult}
            migration_gate: ${migrationResult}
            current_main_combined_gate: ${combinedResult}
            physical_device_validation: NOT_SATISFIED_BY_THIS_GATE
            \`\`\`

            This generated block is the source of truth for the current \`main\` SHA and automated same-SHA acceptance. Manual historical state below must not override it.
            <!-- generated-main-state:end -->`;

            for (const issueNumber of [5, 6]) {
              await upsertComment(issueNumber, combinedMarker, combinedBody);
              await updateGeneratedState(issueNumber, generatedState);
            }
