name: Normalize Gradle Wrapper Mode

on:
  push:
    branches:
      - agent/notification-summary-mvp

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: agent/notification-summary-mvp

      - name: Restore wrapper mode and remove helper workflow
        run: |
          chmod 644 gradlew
          rm .github/workflows/normalize-gradlew-mode.yml
          git config user.name "OpenAI Agent"
          git config user.email "agent@example.invalid"
          git add -A
          git commit -m "chore: restore Gradle wrapper mode"
          git push origin HEAD:agent/notification-summary-mvp
