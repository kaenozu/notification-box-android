name: Android CI Exact Ref

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/android-ci-manual.yml"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to validate
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record tested revision
        run: git rev-parse HEAD | tee "$RUNNER_TEMP/tested-sha.txt"

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Run Linux validation
        run: |
          git config core.fileMode false
          chmod +x gradlew
          python3 .github/scripts/verify-action-pins.py
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
          git diff --check
          git diff --exit-code -- app/schemas
          test -z "$(git ls-files --others --exclude-standard app/schemas)"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Upload Linux validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-ci-exact-ref-linux
          path: |
            ${{ runner.temp }}/tested-sha.txt
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            app/build/reports/lint-results-debug.html
            app/build/outputs/apk/debug/app-debug.apk
            app/schemas
          if-no-files-found: warn
          retention-days: 14

  verify-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record tested revision
        shell: pwsh
        run: git rev-parse HEAD | Tee-Object -FilePath "$env:RUNNER_TEMP\tested-sha.txt"

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Run Windows validation
        shell: pwsh
        run: |
          $output = & .\gradlew.bat :app:dependencyInsight `
            --dependency org.robolectric:robolectric `
            --configuration debugUnitTestRuntimeClasspath `
            --no-daemon 2>&1
          $output | Tee-Object -FilePath "$env:RUNNER_TEMP\dependency-insight-windows.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($output | Select-String 'org\.robolectric:robolectric:4\.16\.1' -Quiet)) {
            throw "Robolectric 4.16.1 was not resolved."
          }

          .\gradlew.bat testDebugUnitTest lintDebug assembleDebug `
            --no-build-cache `
            --rerun-tasks `
            --stacktrace `
            --no-daemon

          $testCount = 0
          Get-ChildItem .\app\build\test-results\testDebugUnitTest\TEST-*.xml |
            ForEach-Object {
              [xml]$result = Get-Content -Raw $_.FullName
              $testCount += [int]$result.testsuite.tests
            }
          if ($testCount -lt 47) {
            throw "Expected at least 47 Windows unit tests; found $testCount."
          }

          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- app/schemas
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (git ls-files --others --exclude-standard app/schemas) {
            throw "Untracked Room schemas detected."
          }
          if (git status --porcelain --untracked-files=all) {
            throw "Validation modified the working tree."
          }

      - name: Upload Windows validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-ci-exact-ref-windows
          path: |
            ${{ runner.temp }}/tested-sha.txt
            ${{ runner.temp }}/dependency-insight-windows.log
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            app/build/reports/lint-results-debug.html
            app/build/outputs/apk/debug/app-debug.apk
            app/schemas
          if-no-files-found: warn
          retention-days: 14

  exact-ref-ci-gate:
    if: always()
    needs:
      - verify-linux
      - verify-windows
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact-ref CI gate
        env:
          LINUX_RESULT: ${{ needs.verify-linux.result }}
          WINDOWS_RESULT: ${{ needs.verify-windows.result }}
        run: |
          if [ "$LINUX_RESULT" != "success" ] || [ "$WINDOWS_RESULT" != "success" ]; then
            echo "Linux result: $LINUX_RESULT"
            echo "Windows result: $WINDOWS_RESULT"
            exit 1
          fi
