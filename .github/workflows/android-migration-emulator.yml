name: Android Migration Emulator

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to validate
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-migration-changes:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.detect.outputs.required }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Detect migration-relevant changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed_files"
          if printf '%s\n' "$changed_files" | grep -Eq \
            '^(\.github/scripts/verify-installed-apk-migration\.sh|\.github/workflows/android-migration-emulator\.yml|app/build\.gradle\.kts|app/schemas/|app/src/androidTest/|app/src/main/java/com/notificationbox/app/data/db/)'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

  verify-room-migration:
    needs: detect-migration-changes
    if: needs.detect-migration-changes.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Enable Gradle and KVM access
        run: |
          chmod +x gradlew
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Accept SDK licenses and install ATD image
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "system-images;android-30;aosp_atd;x86"

      - name: Run managed-device instrumentation tests
        id: managed_device_tests
        run: |
          set +e
          log="$RUNNER_TEMP/managed-device-tests.log"
          ./gradlew pixel2Api30DebugAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            --no-daemon \
            --stacktrace > "$log" 2>&1
          exit_code=$?
          if [ "$exit_code" -ne 0 ]; then cat "$log"; fi
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: room-migration-emulator-diagnostics
          path: |
            ${{ runner.temp }}/managed-device-tests.log
            app/build/outputs/androidTest-results/managedDevice
            app/build/reports/androidTests/managedDevice
            app/schemas
          if-no-files-found: error
          retention-days: 14

      - name: Verify managed-device outcome
        if: always()
        env:
          MANAGED_DEVICE_EXIT: ${{ steps.managed_device_tests.outputs.exit_code }}
        run: |
          if [ "$MANAGED_DEVICE_EXIT" != "0" ]; then
            echo "Managed-device tests exit: $MANAGED_DEVICE_EXIT"
            exit 1
          fi

  verify-installed-apk-migration:
    needs: detect-migration-changes
    if: needs.detect-migration-changes.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      V1_BASELINE: b32d2e4835997eada837df1ca1d3b15c760002a7
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Enable Gradle and KVM access
        run: |
          chmod +x gradlew .github/scripts/verify-installed-apk-migration.sh
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Build v1 and current APKs
        run: |
          V1_DIR="$RUNNER_TEMP/notification-box-v1"
          git worktree add "$V1_DIR" "$V1_BASELINE"
          chmod +x "$V1_DIR/gradlew"
          "$V1_DIR/gradlew" -p "$V1_DIR" assembleDebug --no-daemon
          ./gradlew assembleDebug --no-daemon

      - name: Prepare physical-device APK bundle
        id: physical_device_bundle
        run: |
          set -euo pipefail
          BUNDLE_DIR="$RUNNER_TEMP/physical-device-apks"
          TESTED_SHA="$(git rev-parse HEAD)"
          V1_SHORT="${V1_BASELINE:0:12}"
          CURRENT_SHORT="${TESTED_SHA:0:12}"
          mkdir -p "$BUNDLE_DIR"
          cp "$RUNNER_TEMP/notification-box-v1/app/build/outputs/apk/debug/app-debug.apk" \
            "$BUNDLE_DIR/notification-box-v1-$V1_SHORT.apk"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$BUNDLE_DIR/notification-box-current-$CURRENT_SHORT.apk"
          cp docs/pr4-device-validation.md "$BUNDLE_DIR/"
          (cd "$BUNDLE_DIR" && sha256sum ./*.apk > SHA256SUMS.txt)
          {
            echo "Physical-device validation bundle"
            echo "v1 baseline: $V1_BASELINE"
            echo "current tested HEAD: $TESTED_SHA"
            echo "Use only after Android CI and Android Migration Emulator pass for the same HEAD."
            echo
            echo "Fresh/current-version install:"
            echo "  adb devices -l"
            echo "  adb install -r notification-box-current-$CURRENT_SHORT.apk"
            echo
            echo "Physical-device v1-to-current overwrite migration:"
            echo "  adb install -r notification-box-v1-$V1_SHORT.apk"
            echo "  Create notification history and pin at least one item in v1."
            echo "  Do not uninstall or clear app storage."
            echo "  adb install -r notification-box-current-$CURRENT_SHORT.apk"
            echo
            echo "Complete every required check in pr4-device-validation.md."
            echo "Do not upload raw notification logs or notification screenshots."
          } > "$BUNDLE_DIR/VALIDATION.txt"
          echo "bundle_dir=$BUNDLE_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify installed APK overwrite migration
        id: installed_migration
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          script: >-
            bash .github/scripts/verify-installed-apk-migration.sh
            "$RUNNER_TEMP/notification-box-v1/app/build/outputs/apk/debug/app-debug.apk"
            "app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload installed migration diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installed-apk-migration-diagnostics
          path: installed-apk-migration-report
          if-no-files-found: warn
          retention-days: 14

      - name: Verify installed migration outcome
        if: always()
        env:
          MIGRATION_OUTCOME: ${{ steps.installed_migration.outcome }}
        run: |
          if [ "$MIGRATION_OUTCOME" != "success" ]; then
            echo "Installed APK migration outcome: $MIGRATION_OUTCOME"
            if [ -f installed-apk-migration-report/result.txt ]; then
              cat installed-apk-migration-report/result.txt
            fi
            exit 1
          fi

      - name: Upload physical-device APK bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: physical-device-apks
          path: ${{ steps.physical_device_bundle.outputs.bundle_dir }}
          if-no-files-found: error
          retention-days: 14

  migration-gate:
    if: ${{ always() && !cancelled() }}
    needs:
      - detect-migration-changes
      - verify-room-migration
      - verify-installed-apk-migration
    runs-on: ubuntu-latest
    steps:
      - name: Verify migration gate
        env:
          REQUIRED: ${{ needs.detect-migration-changes.outputs.required }}
          DETECT_RESULT: ${{ needs.detect-migration-changes.result }}
          ROOM_RESULT: ${{ needs.verify-room-migration.result }}
          INSTALLED_RESULT: ${{ needs.verify-installed-apk-migration.result }}
        run: |
          set -euo pipefail
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "Migration change detection failed: $DETECT_RESULT"
            exit 1
          fi
          if [ "$REQUIRED" != "true" ]; then
            echo "No migration-relevant changes; gate passes."
            exit 0
          fi
          if [ "$ROOM_RESULT" != "success" ] || [ "$INSTALLED_RESULT" != "success" ]; then
            echo "Room migration result: $ROOM_RESULT"
            echo "Installed APK migration result: $INSTALLED_RESULT"
            exit 1
          fi
          echo "All migration validations passed."
