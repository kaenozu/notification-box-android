name: Android Release Candidate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Exact branch, tag, or commit SHA to validate without signing
        required: true
        default: main
        type: string
      sign:
        description: Sign the validated artifact after protected-environment approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate-unsigned:
    runs-on: ubuntu-latest
    outputs:
      tested_sha: ${{ steps.identity.outputs.tested_sha }}
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Prepare build environment
        shell: bash
        run: |
          git config core.fileMode false
          chmod +x gradlew

      - name: Record exact candidate identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          artifact_name="notification-box-unsigned-$tested_sha"
          echo "tested_sha=$tested_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Verify immutable action references
        shell: bash
        run: python3 .github/scripts/verify-action-pins.py

      - name: Run unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run release lint
        shell: bash
        run: ./gradlew lintRelease --no-daemon

      - name: Build unsigned release artifacts
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew bundleRelease assembleRelease --no-daemon
          bash .github/scripts/verify-release-manifest.sh

          apk_count="$(find app/build/outputs/apk/release -type f -name '*.apk' | wc -l)"
          aab_count="$(find app/build/outputs/bundle/release -type f -name '*.aab' | wc -l)"
          if [ "$apk_count" -ne 1 ] || [ "$aab_count" -ne 1 ]; then
            echo "Expected exactly one unsigned APK and one unsigned AAB." >&2
            exit 1
          fi

      - name: Create unsigned candidate metadata
        shell: bash
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/unsigned-candidate-metadata.txt"
          {
            echo "repository=kaenozu/notification-box-android"
            echo "tested_sha=${{ steps.identity.outputs.tested_sha }}"
            echo "version_name=0.1.0"
            echo "version_code=1"
            echo "target_sdk=37"
            echo "signed=false"
            echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "artifact_sha256:"
          } > "$metadata"
          find app/build/outputs/bundle/release app/build/outputs/apk/release \
            -type f \( -name '*.aab' -o -name '*.apk' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | tee -a "$metadata"

      - name: Verify repository remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- app/schemas
          test -z "$(git ls-files --others --exclude-standard app/schemas)"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Upload unsigned candidate and diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.txt
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            app/schemas
            ${{ runner.temp }}/unsigned-candidate-metadata.txt
          if-no-files-found: error
          retention-days: 14

  sign-candidate:
    needs: validate-unsigned
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign }}
    runs-on: ubuntu-latest
    environment: release-signing
    steps:
      - name: Checkout protected main for identity verification only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1

      - name: Require exact current main SHA
        shell: bash
        env:
          TESTED_SHA: ${{ needs.validate-unsigned.outputs.tested_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Signing requires an exact 40-character commit SHA." >&2
            exit 1
          fi
          main_sha="$(git rev-parse HEAD)"
          if [ "$TESTED_SHA" != "$main_sha" ]; then
            echo "Signing is restricted to the exact current protected main SHA." >&2
            echo "tested=$TESTED_SHA main=$main_sha" >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download validated unsigned artifact
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: ${{ needs.validate-unsigned.outputs.artifact_name }}
          path: unsigned-candidate

      - name: Sign and verify without executing repository code
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TESTED_SHA: ${{ needs.validate-unsigned.outputs.tested_sha }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "All release-signing environment secrets are required." >&2
              exit 1
            fi
          done

          unsigned_apk="$(find unsigned-candidate -type f -name '*.apk' | head -n 1)"
          unsigned_aab="$(find unsigned-candidate -type f -name '*.aab' | head -n 1)"
          test -n "$unsigned_apk"
          test -n "$unsigned_aab"

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          zipalign="$build_tools/zipalign"
          apksigner="$build_tools/apksigner"
          test -x "$zipalign"
          test -x "$apksigner"

          keystore="$RUNNER_TEMP/notification-box-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"

          output_dir="$RUNNER_TEMP/signed-candidate"
          mkdir -p "$output_dir"
          aligned_apk="$RUNNER_TEMP/app-release-aligned.apk"
          signed_apk="$output_dir/notification-box-$TESTED_SHA.apk"
          signed_aab="$output_dir/notification-box-$TESTED_SHA.aab"

          "$zipalign" -f 4 "$unsigned_apk" "$aligned_apk"
          "$apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$signed_apk" \
            "$aligned_apk"
          "$apksigner" verify --verbose --print-certs "$signed_apk" \
            | tee "$output_dir/apk-signing-certificate.txt"

          jarsigner \
            -keystore "$keystore" \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -signedjar "$signed_aab" \
            "$unsigned_aab" \
            "$KEY_ALIAS"
          jarsigner -verify -strict -verbose "$signed_aab" \
            > "$output_dir/aab-signature-verification.txt"

          {
            echo "repository=kaenozu/notification-box-android"
            echo "tested_sha=$TESTED_SHA"
            echo "version_name=0.1.0"
            echo "version_code=1"
            echo "target_sdk=37"
            echo "signed=true"
            echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            sha256sum "$signed_apk" "$signed_aab"
          } > "$output_dir/signed-candidate-metadata.txt"

          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"

      - name: Upload signed release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notification-box-signed-${{ needs.validate-unsigned.outputs.tested_sha }}
          path: ${{ steps.signing.outputs.output_dir }}
          if-no-files-found: error
          retention-days: 14
