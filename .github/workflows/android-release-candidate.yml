name: Android Release Candidate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to build
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Prepare optional release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          present=0
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -n "$value" ]; then present=$((present + 1)); fi
          done
          if [ "$present" -ne 0 ] && [ "$present" -ne 4 ]; then
            echo "Release signing secrets must be configured all together or all omitted." >&2
            exit 1
          fi
          if [ "$present" -eq 4 ]; then
            keystore="$RUNNER_TEMP/notification-box-upload.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            chmod 600 "$keystore"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify immutable action references
        run: python3 .github/scripts/verify-action-pins.py

      - name: Build and validate release candidate
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          git config core.fileMode false
          chmod +x gradlew
          ./gradlew \
            testDebugUnitTest \
            lintRelease \
            bundleRelease \
            assembleRelease \
            --no-daemon

      - name: Create candidate metadata
        id: metadata
        shell: bash
        env:
          SIGNING_READY: ${{ steps.signing.outputs.ready }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/release-candidate-metadata.txt"
          tested_sha="$(git rev-parse HEAD)"
          {
            echo "repository=kaenozu/notification-box-android"
            echo "tested_sha=$tested_sha"
            echo "version_name=0.1.0"
            echo "version_code=1"
            echo "release_signing_configured=$SIGNING_READY"
            echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "artifact_sha256:"
          } > "$metadata"

          find app/build/outputs/bundle/release app/build/outputs/apk/release \
            -type f \( -name '*.aab' -o -name '*.apk' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | tee -a "$metadata"

          apk="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1 || true)"
          if [ -n "$apk" ] && [ "$SIGNING_READY" = "true" ]; then
            apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            echo >> "$metadata"
            echo "apk_signing_certificate:" >> "$metadata"
            "$apksigner" verify --print-certs "$apk" | tee -a "$metadata"
          fi

          aab="$(find app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1 || true)"
          if [ -n "$aab" ] && [ "$SIGNING_READY" = "true" ]; then
            jarsigner -verify "$aab" >/dev/null
            echo "aab_signature_verification=PASS" >> "$metadata"
          fi

          cat "$metadata"
          echo "tested_sha=$tested_sha" >> "$GITHUB_OUTPUT"

      - name: Verify repository remains clean
        shell: bash
        run: |
          git diff --check
          git diff --exit-code -- app/schemas
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short
            exit 1
          fi

      - name: Upload release candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notification-box-release-candidate-${{ steps.metadata.outputs.tested_sha || github.sha }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/reports/lint-results-release.html
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            ${{ runner.temp }}/release-candidate-metadata.txt
          if-no-files-found: error
          retention-days: 14
