<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>通知箱</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.7; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    main { max-width: 760px; margin: 0 auto; padding: 48px 20px 72px; }
    .hero { padding: 32px; border-radius: 24px; background: color-mix(in srgb, Highlight 16%, Canvas); }
    h1 { font-size: clamp(2rem, 7vw, 4rem); margin: 0 0 12px; }
    .tagline { font-size: 1.25rem; }
    nav { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 12px; }
    a.button { display: inline-block; padding: 10px 16px; border-radius: 999px; background: LinkText; color: Canvas; text-decoration: none; font-weight: 700; }
    section { margin-top: 36px; }
  </style>
</head>
<body>
<main>
  <div class="hero">
    <h1>通知箱</h1>
    <p class="tagline">通知を、消さずに整理する。端末内で分類し、まずは安全に試算。</p>
    <nav>
      <a class="button" href="privacy-policy.html">プライバシーポリシー</a>
      <a class="button" href="mailto:neoenox@gmail.com">お問い合わせ</a>
    </nav>
  </div>
  <section>
    <h2>v0.1.0 技術ベータ</h2>
    <p>通知箱は、Androidに届いた通知を「優先」「あとで確認」「低優先」に分類し、自分に合う整理ルールを試すためのアプリです。</p>
    <p>通知内容は端末内だけで処理し、外部サーバーへ送信しません。現在のバージョンは元のOS通知を削除、抑制、スヌーズ、遅延しません。</p>
  </section>
</main>
</body>
</html>
